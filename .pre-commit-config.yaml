repos:
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest fast suite
        entry: venv/bin/python3 -m pytest tests/ -m fast -x --tb=line -q
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      - id: swift-build
        name: swift build (iOS)
        entry: bash -c "cd ios/EnglishBot && swift build 2>&1 | tail -3"
        language: system
        types: [swift]
        pass_filenames: false
        verbose: true

      - id: ruff-check
        name: ruff lint
        entry: venv/bin/python3 -m ruff check --fix
        language: system
        types: [python]
        pass_filenames: true
        verbose: true
