components:
  securitySchemes:
    XApiKeyPlaceholder:
      type: apiKey
      in: header
      name: X-API-Key
      description: None in v1 beyond trusted LAN assumptions; header reserved for future hardening.
  parameters:
    UserId:
      name: user_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
      example: 5c2f2d1f-2cc9-4ce6-b673-95d7dcf61aab
    PhaseIdPath:
      name: phase_id
      in: path
      required: true
      schema:
        type: integer
      example: 101
  responses:
    ErrorResponse:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidAudio:
              value:
                error_code: INVALID_AUDIO
                message: Uploaded file could not be decoded as supported practice audio.
                detail:
                  supported_content_types: [audio/m4a, audio/x-m4a, audio/wav, audio/mpeg, audio/ogg]
            onboardingIncomplete:
              value:
                error_code: ONBOARDING_INCOMPLETE
                message: Complete onboarding before starting practice.
                detail:
                  required_endpoint: /onboarding/start
  schemas:
    UserProfile:
      type: object
      required: [user_id, username, interface_language, created_at, current_level, total_sessions, streak_count]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        interface_language:
          type: string
          enum: [vi, en]
        created_at:
          type: string
          format: date-time
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        active_curriculum_id:
          type: integer
          nullable: true
        current_level:
          type: integer
          minimum: 1
          maximum: 3
        total_sessions:
          type: integer
          minimum: 0
        streak_count:
          type: integer
          minimum: 0
