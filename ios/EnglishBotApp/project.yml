name: EnglishBotApp
options:
  bundleIdPrefix: com.englishbot
  deploymentTarget:
    iOS: 16.0
settings:
  base:
    PRODUCT_NAME: EnglishBot
    PRODUCT_BUNDLE_IDENTIFIER: com.englishbot.app
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
packages:
  EnglishBotPackage:
    path: ../EnglishBot
targets:
  EnglishBotApp:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: EnglishBotPackage
        product: App
schemes:
  EnglishBotApp:
    build:
      targets:
        EnglishBotApp: all
